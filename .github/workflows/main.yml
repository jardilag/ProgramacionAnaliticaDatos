name: Pipeline CI/CD Scraping Mercado Libre

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    - name: Configurar Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Instalar Google Chrome (Headless)
      run: |
        sudo apt-get update
        sudo apt-get install -y wget curl unzip
        wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
        sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get install -f -y

    - name: Instalar dependencias del proyecto
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ejecutar pruebas automatizadas con pytest (CI)
      run: |
        pytest test_scraper.py

    - name: Generar artefacto de despliegue (CD)
      run: |
        python scraper.py

    - name: Subir dataset CSV como Artefacto de GitHub
      uses: actions/upload-artifact@v4
      with:
        name: dataset-laptops-csv
        path: laptops_mercadolibre.csv
