name: CI y scraping manual de libros

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Pruebas en GitHub
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    - name: Configurar Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Instalar dependencias del proyecto
      run: python -m pip install -r requirements.txt

    # Las pruebas usan HTML local y no consultan el sitio externo.
    - name: Ejecutar pruebas automatizadas con pytest (CI)
      run: python -m pytest -v

  scraping-local:
    name: Scraping manual en Windows
    needs: build-and-test
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    - name: Configurar Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Crear entorno virtual para esta ejecucion
      run: python -m venv .venv

    - name: Instalar dependencias del proyecto
      run: .\.venv\Scripts\python.exe -m pip install -r requirements.txt

    # El catalogo se obtiene por HTTP; no requiere Chrome ni Selenium.
    - name: Extraer catalogo de Books to Scrape
      run: .\.venv\Scripts\python.exe scraper.py

    - name: Generar historico de ventas SIMULADAS
      run: .\.venv\Scripts\python.exe generar_ventas.py

    - name: Subir catalogo e historico simulado
      uses: actions/upload-artifact@v4
      with:
        name: datasets-libros
        path: |
          data/libros_books_to_scrape.csv
          data/ventas_simuladas.csv
        if-no-files-found: error
